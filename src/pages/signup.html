<main class="page page-auth">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-logo" aria-label="Fit Deal Home">
          <span class="auth-brand-name">Fit Deal</span>
          <svg class="auth-brand-spark" aria-hidden="true"><use href="#i-sparkle"/></svg>
        </a>
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Join thousands of smart shoppers comparing prices across Amazon, Flipkart, Myntra &amp; AJIO.</p>
      </div>

      <div class="auth-oauth">
        <button type="button" class="btn-oauth btn-google" id="googleSignupBtn">
          <svg class="oauth-ico" aria-hidden="true"><use href="#i-google"/></svg>
          <span>Sign up with Google</span>
        </button>
      </div>

      <div class="auth-divider">
        <span>or sign up with email</span>
      </div>

      <div class="auth-alert" id="authAlert" role="alert" hidden></div>

      <form class="auth-form" id="signupForm" novalidate>
        <div class="form-group">
          <label for="signupName" class="form-label">Full Name</label>
          <div class="input-wrap">
            <input type="text" id="signupName" name="fullName" class="form-input" placeholder="e.g. Priya Sharma" required autocomplete="name" maxlength="50">
          </div>
        </div>

        <div class="form-group">
          <label for="signupEmail" class="form-label">Email address</label>
          <div class="input-wrap">
            <input type="email" id="signupEmail" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="signupPassword" class="form-label">Create Password</label>
          <div class="input-wrap input-wrap-pass">
            <input type="password" id="signupPassword" name="password" class="form-input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
            <button type="button" class="btn-pass-toggle" id="toggleSignupPass" aria-label="Toggle password visibility">
              <svg class="ico-eye" aria-hidden="true"><use href="#i-eye"/></svg>
              <svg class="ico-eye-off" aria-hidden="true" hidden><use href="#i-eye-off"/></svg>
            </button>
          </div>
          <div class="pass-strength-meter" id="passStrengthMeter" hidden>
            <div class="meter-bar"><span class="meter-fill" id="meterFill"></span></div>
            <span class="meter-label" id="meterLabel">Password strength</span>
          </div>
        </div>

        <div class="form-row form-terms-row">
          <label class="form-check-label">
            <input type="checkbox" id="signupTerms" name="terms" required checked>
            <span>I agree to Fit Deal's <a href="/terms/" target="_blank">Terms of Use</a> and <a href="/privacy/" target="_blank">Privacy Policy</a>.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg btn-auth-submit" id="signupSubmitBtn">
          <span class="btn-text">Create Free Account</span>
          <span class="btn-spinner" aria-hidden="true" hidden></span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="/login/" class="auth-switch-link">Sign In</a></p>
      </div>

      <div class="auth-trust-strip">
        <div class="auth-trust-item">
          <svg aria-hidden="true"><use href="#i-shield"/></svg>
          <span>Free Forever</span>
        </div>
        <div class="auth-trust-item">
          <svg aria-hidden="true"><use href="#i-check-plain"/></svg>
          <span>No Spam, Ever</span>
        </div>
      </div>
    </div>
  </div>
</main>
