<main class="page page-auth">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-logo" aria-label="Fit Deal Home">
          <span class="auth-brand-name">Fit Deal</span>
          <svg class="auth-brand-spark" aria-hidden="true"><use href="#i-sparkle"/></svg>
        </a>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Log in to sync your saved items, price drop alerts, and fashion comparisons across all your devices.</p>
      </div>

      <div class="auth-oauth">
        <button type="button" class="btn-oauth btn-google" id="googleLoginBtn">
          <svg class="oauth-ico" aria-hidden="true"><use href="#i-google"/></svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <div class="auth-divider">
        <span>or sign in with email</span>
      </div>

      <div class="auth-alert" id="authAlert" role="alert" hidden></div>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail" class="form-label">Email address</label>
          <div class="input-wrap">
            <input type="email" id="loginEmail" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label for="loginPassword" class="form-label">Password</label>
            <a href="/contact/?topic=Password+reset" class="form-forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrap input-wrap-pass">
            <input type="password" id="loginPassword" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="btn-pass-toggle" id="toggleLoginPass" aria-label="Toggle password visibility">
              <svg class="ico-eye" aria-hidden="true"><use href="#i-eye"/></svg>
              <svg class="ico-eye-off" aria-hidden="true" hidden><use href="#i-eye-off"/></svg>
            </button>
          </div>
        </div>

        <div class="form-row form-remember-row">
          <label class="form-check-label">
            <input type="checkbox" id="loginRemember" name="remember" checked>
            <span>Keep me signed in</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg btn-auth-submit" id="loginSubmitBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner" aria-hidden="true" hidden></span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/signup/" class="auth-switch-link">Create an account</a></p>
      </div>

      <div class="auth-trust-strip">
        <div class="auth-trust-item">
          <svg aria-hidden="true"><use href="#i-shield"/></svg>
          <span>100% Secure &amp; Private</span>
        </div>
        <div class="auth-trust-item">
          <svg aria-hidden="true"><use href="#i-step-compare"/></svg>
          <span>Free Forever Price Comparison</span>
        </div>
      </div>
    </div>
  </div>
</main>
